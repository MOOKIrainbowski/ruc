name: RucRpg
version: '${version}'
main: kr.rucserver.rpg.RucRpg
api-version: '1.21'
author: Ruc Server
description: 러크 RPG (마크) — 스탯 · 직업 · 스킬 · 아이템 · 몹 · 던전 (구 국가전 서버)
depend: [RucCore]

commands:
  rpgadmin:
    description: 러크 RPG 관리 (데이터 다시 읽기 · 정보)
    usage: /rpgadmin <info | exp <이름> <양> | level <이름> <레벨> | spawn <몹> [레벨] [등급] [수] | give <이름> <아이템> [수] [희귀도] | build <맵> | goto <맵>>
    permission: rucrpg.admin
  rpgmenu:
    description: RPG 메뉴 (인벤토리 · 스킬 · 퀘스트 · 파티 · 지도 · 창고 · 설정)
    usage: /창
    aliases: [창, rpg]   # /메뉴 는 RucCore(러크 네트워크 메뉴)가 씀 — 기존 그대로
  rpgskill:
    description: 스킬창 (배운 스킬 · 슬롯 장착)
    aliases: [스킬, skill]
  rpgstats:
    description: 스탯창
    aliases: [스탯, stats]
  rpgquest:
    description: 퀘스트 일지
    aliases: [퀘스트, quest]
  rpgparty:
    description: 파티 (초대 · 수락 · 거절 · 나가기 · 추방 · 위임 · 해산)
    aliases: [파티, party]
  rpgpc:
    description: 파티 채팅
    aliases: [ㅍ, pc]
  rpgping:
    description: 핑 (바라보는 곳)
    aliases: [핑, ping]
  rpgduel:
    description: 결투 신청 · 수락
    aliases: [결투, duel]
  rpgdungeon:
    description: 던전 입장 · 나가기
    aliases: [던전, dungeon]
  rpgjob:
    description: 전직
    aliases: [전직, job]

permissions:
  rucrpg.admin:
    description: RPG 관리 · GM 권한
    default: op
