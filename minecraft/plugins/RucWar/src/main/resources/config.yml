# RucWar 설정 — 국가전 서버 (§2.6)
#
# 길드·국가 설정(창설 조건, 국가 인원 기준)은 RucCore 의 config.yml 에 있습니다.
# 여기에는 이 서버에서만 쓰는 것만 둡니다.

# 국가전 규칙을 적용할 월드
worlds:
  - world
  - world_nether
  - world_the_end

# 몹이 블록을 부수는 것(크리퍼 등). 전쟁 중 지형 파괴는 콘텐츠지만,
# 평시에 몹이 영토를 갉아먹으면 방어 시설이 저절로 무너집니다.
mob-griefing: false

# ── 전쟁 시간대 (§2.6) ────────────────────────────────────────────────
# 이 시간대에만 코어를 설치할 수 있고, 코어를 부술 수 있고, 영토 보호가 풀립니다.
# 기준 시간대는 RucCore 의 timezone 설정을 따릅니다 (기본 Asia/Seoul).
#
# 서버의 시스템 시간대를 쓰지 않는 이유: 운영 VPS 가 UTC 인 경우가 많고,
# 그러면 "저녁 8시" 가 실제로는 새벽 5시가 됩니다.
war:
  enabled: true

  # 개전 요일. 비우면 매일입니다. 한국어(월~일)와 영어(mon~sun) 모두 됩니다.
  days: []

  # HH:mm. end 가 start 보다 이르면 자정을 넘는 시간대로 해석합니다.
  start: "20:00"
  end: "22:00"

  # 개전 몇 분 전에 예고할지
  warn-minutes:
    - 60
    - 30
    - 10
    - 5
    - 1

# ── 코어 거점 ─────────────────────────────────────────────────────────
# 코어는 여기 적힌 지점에만 설치할 수 있습니다. 아무 데나 박을 수 없게 하는 것이
# D2 의 요구사항이고, 그래야 전투가 몇 곳으로 모여 서로 만나게 됩니다.
#
# y 는 적지 않습니다 — 설치 시 지표면을 씁니다. 고정하면 지형에 따라 허공이나
# 지하에 박힙니다 (드래곤 알 제단에서 한 번 겪은 실수입니다).
core-sites:
  - name: 북서
    world: world
    x: -400
    z: 400
  - name: 북동
    world: world
    x: 400
    z: 400
  - name: 남서
    world: world
    x: -400
    z: -400
  - name: 남동
    world: world
    x: 400
    z: -400
  - name: 중앙남
    world: world
    x: 0
    z: 600

territory:
  # 코어를 중심으로 몇 청크까지 영토인지. 8 이면 17×17 청크(272×272 블록)입니다.
  # 거점 간 거리가 800 블록이라 이 값으로는 영토가 겹치지 않습니다.
  claim-chunk-radius: 8

  # 거점으로 인정하는 반경(블록). 대좌 위 아무 칸에나 놓을 수 있게 넉넉히 둡니다.
  site-radius: 6

  # 스폰 주변 중립 구역 반경(블록). 여기서는 아무도 건축할 수 없습니다.
  neutral-radius: 100
  neutral-world: world

  # 한 길드가 동시에 가질 수 있는 코어 수. 한 길드가 전 거점을 독점하면
  # 다른 길드가 들어갈 자리가 없어 서버가 끝납니다.
  max-cores-per-guild: 2

  # 거점에 흑요석 대좌를 세울지. 플레이어가 거점을 찾을 수 있게 하는 표식입니다.
  build-pedestals: true

  # 시즌 점수 (§3.5 랭킹 보상의 재료)
  points:
    # 전쟁 시간대 종료까지 코어를 지켜냈을 때
    defended: 500
    # 남의 코어를 부쉈을 때
    core-destroyed: 200
    # 전쟁 중 다른 국가 사람 처치
    kill: 10

# ── 코어 아이템 (D2) ──────────────────────────────────────────────────
core:
  # 2026-10-10 — 러크 코어는 오버월드 어디에나 설치 (위 core-sites 는 false 일 때만 씀).
  # 영토가 중립 구역이나 다른 코어의 영토와 겹치는 자리에는 못 박습니다.
  free-placement: true
  # 코어 내구도. 5×5×5 몸체를 무기로 때려 깎습니다 (피해 = 무기 공격력 × 쿨다운 × 강화 배율).
  # 0 이 되면 코어 아이템(귀속 없음)으로 떨어집니다. 주인 국가에 10초마다 "공격받는 중" 경보.
  hp: 500
  # 신호기처럼 쏘아 올리는 빛 기둥 높이 (블록). 위치가 드러나는 대가입니다.
  beam-height: 96

  # 국가 인장 가격. 제작 불가이므로 이 값이 코어 하나의 비용 하한이 됩니다.
  # 길드 금고에서 차감되고, 길드장만 살 수 있습니다.
  seal-price: 250000

  # 코어를 버리지 못하게 합니다. 일주일 모은 물건이라 실수 한 번이 치명적입니다.
  prevent-drop: true

  # 인장 상인 NPC
  merchant:
    enabled: true
    world: world
    x: 8.5
    z: 8.5
    # 음수면 지표면으로 스냅합니다.
    y: -1

# ── 국가창고 (§3.3) ───────────────────────────────────────────────────
storage:
  # 줄 수 (1~6). 줄이면 기존 내용이 칸 밖으로 밀려나므로 줄이지 마세요.
  rows: 6
  # 열려 있는 창고를 주기적으로 저장합니다 (분). 0 이면 끔.
  autosave-minutes: 5

# ── /tp [코어명] ──────────────────────────────────────────────────────
warp:
  # 평시 시전 시간(초)
  warmup-seconds: 5
  # 전쟁 중 시전 시간. 더 길게 둡니다 — 즉시 집결은 수비가 대응할 시간을
  # 아예 없애 버립니다.
  warmup-seconds-war: 10
  cooldown-seconds: 60

# ── 강화 (2026-10-10) ─────────────────────────────────────────────────
# 강화대 = 화살 제작대(리소스팩으로 다시 그림). 마법이 붙은 장비만, 최대 +10.
# 표의 n번째 칸 = +n → +(n+1) 시도. 성공 / 하락(-1) / 파괴는 % (나머지 = 그대로).
upgrade:
  success:   [100, 90, 80, 70, 60, 50, 40, 30, 20, 10]
  downgrade: [  0,  0,  0, 10, 20, 25, 30, 35, 40, 45]
  destroy:   [  0,  0,  0,  0,  0,  2,  5,  8, 12, 15]
  cost:      [  1,  1,  2,  2,  3,  4,  5,  6,  8, 10]   # 러크 강화석 개수 (합 42)

  effect:
    damage-per-level: 0.04            # 근접 · 활 · 쇠뇌 · 삼지창 피해 +4%/단계 (+10 = +40%)
    armor-reduction-per-level: 0.0075 # 부위 합산 (풀세트 +10 = -30%, 최대 -40%)
    tool-efficiency-per-level: 2      # 채굴 효율 속성 (+10 = +20)

  # 광석을 캘 때 강화석이 나올 확률 (실크터치 · 크리에이티브 제외)
  stone-drops:
    DIAMOND_ORE: 0.05
    DEEPSLATE_DIAMOND_ORE: 0.05
    EMERALD_ORE: 0.06
    DEEPSLATE_EMERALD_ORE: 0.06
    GOLD_ORE: 0.01
    DEEPSLATE_GOLD_ORE: 0.01
    ANCIENT_DEBRIS: 0.15
  # 남의 코어를 부순 자리에 떨어지는 강화석
  core-destroy-stones: 8

# ── 보급 상자 (2026-10-10) ────────────────────────────────────────────
# 종전 때마다 오버월드 곳곳에 배틀로얄식 상자(통)를 떨구고 좌표를 공지합니다.
# 남의 영토에 떨어진 상자는 평시에 그 국가만 엽니다. 다음 보급 때 옛 상자는 사라집니다.
supply:
  enabled: true
  world: world
  count: 6
  radius: 1500        # 스폰 기준
  min-distance: 200   # 스폰 중립 구역 밖
  stones-min: 2
  stones-max: 5
  # "재료 최소-최대 확률%"
  loot:
    - "DIAMOND 2-6 70%"
    - "NETHERITE_SCRAP 1-2 25%"
    - "NETHERITE_INGOT 1 6%"
    - "ENCHANTED_GOLDEN_APPLE 1 8%"
    - "GOLDEN_APPLE 2-5 60%"
    - "TOTEM_OF_UNDYING 1 10%"
    - "ENDER_PEARL 4-8 60%"
    - "EXPERIENCE_BOTTLE 8-24 60%"
    - "ECHO_SHARD 1-2 20%"
    - "NETHER_STAR 1 3%"
    - "ELYTRA 1 2%"

# ── 광물이 풍부한 오버월드 (2026-10-10) ────────────────────────────────
# 새로 생성되는 청크에만 광맥을 더 박습니다. "청크당 광맥 수  최저y  최고y  광맥 크기"
rich-ores:
  enabled: true
  ores:
    DIAMOND: "3 -64 16 5"
    GOLD: "4 -64 32 7"
    IRON: "8 -32 72 9"
    EMERALD: "3 -16 160 3"
    LAPIS: "3 -64 32 6"
    REDSTONE: "3 -64 16 7"
    COPPER: "4 0 96 9"
