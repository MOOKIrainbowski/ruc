name: RucPeace
version: '${version}'
main: kr.rucserver.peace.RucPeace
api-version: '1.21'
author: Ruc Server
description: 러크 평화 서버 — 직접·간접 살해 차단, 테러 탐지 기록, 홈/스폰
depend: [RucCore]

commands:
  spawn:
    description: 서버 스폰으로 이동합니다.
    usage: /spawn
    aliases: [스폰]
  sethome:
    description: 현재 위치를 홈으로 지정합니다.
    usage: /sethome
    aliases: [셋홈, 홈설정]
  home:
    description: 지정한 홈으로 이동합니다.
    usage: /home
    aliases: [홈]
  delhome:
    description: 지정한 홈을 삭제합니다.
    usage: /delhome
    aliases: [홈삭제]
  peacelog:
    description: (스태프) 막힌 살해 시도 기록을 봅니다. 콘솔에서도 됩니다.
    usage: /평화기록 [닉네임]
    aliases: [평화기록, 테러기록]
    permission: rucpeace.staff

permissions:
  rucpeace.staff:
    description: 평화 서버 테러 기록 조회 및 실시간 알림 수신
    default: op
  rucpeace.bypass:
    description: 살해 차단을 받지 않습니다 (검증·운영용). 함부로 주지 마세요.
    default: false
  rucpeace.bypass.warmup:
    description: 텔레포트 시전 시간을 건너뜁니다
    default: op
  rucpeace.bypass.cooldown:
    description: 텔레포트 쿨타임을 무시합니다
    default: op
