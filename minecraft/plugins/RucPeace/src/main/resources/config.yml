# RucPeace 설정 — 평화 서버 (§2.5)
#
# 화폐·경험치·평판은 RucCore 의 config.yml 에 있습니다.
# 여기에는 이 서버에서만 쓰는 것만 둡니다.

# 평화 규칙을 적용할 월드
worlds:
  - world
  - world_nether
  - world_the_end

# 죽어도 짐을 지킵니다. 죽음이 사람 탓이 아닌 서버에서 짐까지 잃게 하면
# 사고 한 번이 하루를 지웁니다.
keep-inventory: true

# 몹이 블록을 부수는 것(크리퍼·엔더맨). 폭발로 남을 죽이는 것은 리스너가
# 막지만, 건축 훼손은 그것과 별개입니다.
mob-griefing: false

# ── 가해자 추적 (§2.5) ────────────────────────────────────────────────
# 바닐라가 알려 주지 않는 가해자를 기록해 두는 장부의 설정입니다.
attribution:
  # 밀친 뒤 몇 초 안의 낙하·용암 사망까지 그 사람 탓으로 볼지.
  #
  # 짧으면 "밀고 기다렸다" 를 놓치고, 길면 한참 뒤의 사고사까지 사람 탓이
  # 되어 평화 서버에서 아무도 자연사하지 못합니다. 10초는 "밀려서 떨어지는
  # 동안" 을 덮되 그 이상은 인과로 보지 않는 값입니다.
  window-seconds: 10

  # 베드·앵커 폭발을 피해자 위치와 맞출 반경(블록).
  # 폭발 지점과 피해자 위치가 정확히 같을 수는 없습니다.
  blast-radius: 12


  # 몸으로 밀기를 판정할 접촉 거리(블록).
  #
  # 충돌로 밀려면 실제로 닿아야 하므로, 이 거리 안에 있던 사람은 추측이 아니라
  # 물리적 전제입니다. 넓히면 지나가던 사람이 가해자가 됩니다.
  contact-reach: 1.6

  # 창을 넘긴 기록을 버리는 주기(초). 안 하면 조용히 새는 메모리가 됩니다.
  purge-seconds: 60

# ── 테러 · 그리핑 기록 (§2.5) ─────────────────────────────────────────
# 막힌 시도는 "누군가 죽이려 했다" 는 증거입니다. Helper 재량 제재의 근거이고,
# 나중에 디스코드 신고(§3.8)와 제재 티어(§3.9)가 이 기록을 봅니다.
incident:
  # 같은 (가해자→피해자) 쌍을 몇 초 안에 다시 적지 않을지.
  #
  # 크리스탈 한 번에 피해 이벤트가 여러 번 들어오고, 용암에 밀린 사람은 초당
  # 여러 번 피해를 받습니다. 그대로 적으면 한 사건이 수십 줄이 됩니다.
  debounce-seconds: 10

  # 접속 중인 스태프에게 실시간으로 알릴지.
  # 사후 조회만 있으면 아무도 보지 않습니다.
  notify-staff: true

  # /평화기록 이 한 번에 보여 줄 줄 수
  log-limit: 15

# ── 텔레포트 (§3.3) ───────────────────────────────────────────────────
# Core 의 공용 HomeService 가 이 값을 읽습니다.
# 약탈 서버와 달리 전투 태그가 없어 막히는 경우가 없습니다.
teleport:
  warmup-seconds: 5
  cooldown-seconds: 30

spawn:
  # false 면 월드의 기본 스폰 지점을 씁니다.
  use-custom: false
  world: world
  x: 0.5
  y: 80
  z: 0.5
  yaw: 0
  pitch: 0
