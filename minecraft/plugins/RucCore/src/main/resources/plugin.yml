name: RucCore
version: '${version}'
main: kr.rucserver.core.RucCore
api-version: '1.21'
author: Ruc Server
description: 러크 서버 네트워크 공용 시스템 — Ruc 화폐, 자체 XP, 평판, 스코어보드
softdepend: []

commands:
  tpa:
    description: 상대에게 내가 이동하는 텔레포트를 요청합니다.
    usage: /tpa <player>
    aliases: [tpask]
  tpahere:
    description: 상대를 내 위치로 부르는 텔레포트를 요청합니다.
    usage: /tpahere <player>
  tpaccept:
    description: 받은 텔레포트 요청을 수락합니다.
    usage: /tpaccept
    aliases: [tpyes, 수락]
  tpdeny:
    description: 받은 텔레포트 요청을 거절합니다.
    usage: /tpdeny
    aliases: [tpno, 거절]
  tpcancel:
    description: 내가 보낸 텔레포트 요청을 취소합니다.
    usage: /tpcancel
  ruc:
    description: 보유한 Ruc를 확인합니다. (스태프) /ruc give 로 지급합니다.
    usage: /ruc [player] | /ruc give <player> <amount>
    aliases: [money, 재화]
  level:
    description: 현재 레벨과 경험치를 확인합니다.
    usage: /level
    aliases: [lv, 레벨]
  ruclang:
    description: 표시 언어를 변경합니다. (ko / en)
    usage: /ruclang <ko|en>
    aliases: [언어]
  verify:
    description: 디스코드 인증 코드를 확인하거나 새로 받습니다.
    usage: /verify
    aliases: [인증]
  verifyapprove:
    description: (스태프) 플레이어를 수동으로 인증 승인합니다.
    usage: /verifyapprove <player>
    aliases: [인증승인]
    permission: ruccore.admin
  menu:
    description: 네트워크 메뉴를 엽니다. (웅크린 채 F 키와 동일)
    usage: /menu
    aliases: [메뉴, 서버, servers]
  levelup:
    description: (스태프) 대상의 레벨을 즉시 지정합니다. 내리는 것도 됩니다.
    usage: /levelup <player> <level>
    aliases: [레벨설정, setlevel, 레벨업]
    permission: ruccore.admin
  rucxp:
    description: (스태프) 경험치를 지급합니다. 레벨업 점검용.
    usage: /rucxp <양> [닉네임]
    aliases: [경험치지급]
    permission: ruccore.admin
  rucverify:
    description: (콘솔/RCON 전용) 디스코드 봇이 인증 코드를 검증할 때 씁니다.
    usage: /rucverify <code> <discordId> <discordName>
    permission: ruccore.admin
  mailbox:
    description: 우편함을 엽니다. 보상과 거래 물품은 여기로 도착합니다.
    usage: /우편함
    aliases: [우편함, 우편, mail, 메일]
  mailsend:
    description: (스태프) 손에 든 아이템을 대상의 우편함으로 보냅니다. 미접속자도 됩니다.
    usage: /mailsend <닉네임>
    aliases: [우편보내기]
    permission: ruccore.admin
  title:
    description: 보유한 칭호를 보고 표시할 것을 고릅니다.
    usage: /칭호 [칭호키|자동]
    aliases: [칭호, titles]
  ructitle:
    description: (콘솔/RCON 전용) 디스코드 봇이 역할 변경을 알릴 때 씁니다.
    usage: /ructitle <discordId> [roleId,roleId,...]
    permission: ruccore.admin
  titlegrant:
    description: (스태프) 칭호를 직접 부여합니다. source 는 staff/purchase/guide.
    usage: /titlegrant <닉네임> <칭호키> [source]
    aliases: [칭호부여]
    permission: ruccore.admin
  report:
    description: 플레이어를 신고합니다. 스태프가 확인 후 처리합니다.
    usage: /신고 <닉네임> <사유>
    aliases: [신고]
  reporthandle:
    description: (스태프) 신고를 확정하거나 기각합니다. 확정 시 평판이 내려갑니다.
    usage: /신고처리 <번호> <확정|기각>
    aliases: [신고처리]
    permission: ruccore.admin
  reportlist:
    description: (스태프) 처리하지 않은 신고 목록.
    usage: /신고목록
    aliases: [신고목록]
    permission: ruccore.admin
  rucreps:
    description: (콘솔/RCON 전용) 디스코드 연동자들의 평판 티어. 역할 동기화에 씁니다.
    usage: /rucreps [offset] [limit]
    permission: ruccore.admin
  rucinfo:
    description: (콘솔/RCON 전용) 플레이어 기록 요약. 신고 처리에 씁니다.
    usage: /rucinfo <닉네임>
    permission: ruccore.admin
  rucsanction:
    description: (콘솔/RCON 전용) 디스코드 봇의 /제재 가 마크 쪽 제재를 기록·해제·조회합니다.
    usage: /rucsanction <apply|revoke|history> ...
    permission: ruccore.admin
  rucpay:
    description: (콘솔/RCON 전용) 디스코드 봇의 /충전 이 주문·입금·지급을 처리합니다.
    usage: /rucpay <order|deposit|approve|link|refund|ignore|cancel|redeliver|status|lookup|review|...>
    permission: ruccore.admin
  charge:
    description: 충전·후원 안내. 구매는 디스코드에서 합니다.
    usage: /충전
    aliases: [충전, 후원, 구매, 결제, donate, store]
  enderexpand:
    description: 엔더상자 확장권을 레벨 · Ruc 로 삽니다 (우편으로 지급). 엔더상자는 Shift+F 메뉴에서.
    usage: /엔더확장 [구매]
    aliases: [엔더확장, 엔더]
  usershop:
    description: 유저 상점을 엽니다. 더블클릭으로 구매합니다.
    usage: /유저상점
    aliases: [유저상점, 상점, shop]
  shopsell:
    description: 손에 든 아이템을 유저 상점에 올립니다. 취소 = 내 판매 목록.
    usage: /판매등록 <가격|취소>
    aliases: [판매등록, register, sell]
  rucrelay:
    description: (콘솔/RCON 전용) 디스코드 발언을 인게임에 중계합니다.
    usage: /rucrelay <발신자> <내용...>
    permission: ruccore.admin
  titlerevoke:
    description: (스태프) 칭호를 회수합니다. all 이면 전부. 디스코드 칭호는 다음 동기화에 다시 붙습니다.
    usage: /titlerevoke <닉네임> <칭호키|all>
    aliases: [칭호회수, 칭호삭제]
    permission: ruccore.admin
  guild:
    description: 길드를 만들고 관리합니다. 길드원이 모이면 국가가 됩니다.
    usage: /길드 <창설|초대|수락|탈퇴|추방|임명|강등|위임|금고|정보|랭킹|해산>
    aliases: [길드, g, 국가, nation]
  guildadmin:
    description: (스태프) 길드 운영 — 목록·점수·국가 지정·시즌 정산. 콘솔에서도 됩니다.
    usage: /길드관리 <목록|정보|점수|국가|시즌마감|새로고침>
    aliases: [길드관리, gadmin]
    permission: ruccore.admin

permissions:
  ruccore.admin:
    description: RucCore 관리 권한
    default: op
