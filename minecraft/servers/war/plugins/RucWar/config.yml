# RucWar 설정 — 국가전 서버 (§2.6)
#
# 길드·국가 설정(창설 조건, 국가 인원 기준)은 RucCore 의 config.yml 에 있습니다.
# 여기에는 이 서버에서만 쓰는 것만 둡니다.

# 국가전 규칙을 적용할 월드
worlds:
  - world
  - world_nether
  - world_the_end

# 몹이 블록을 부수는 것(크리퍼 등). 전쟁 중 지형 파괴는 콘텐츠지만,
# 평시에 몹이 영토를 갉아먹으면 방어 시설이 저절로 무너집니다.
mob-griefing: false

# ── 전쟁 시간대 (§2.6) ────────────────────────────────────────────────
# 이 시간대에만 코어를 설치할 수 있고, 코어를 부술 수 있고, 영토 보호가 풀립니다.
# 기준 시간대는 RucCore 의 timezone 설정을 따릅니다 (기본 Asia/Seoul).
#
# 서버의 시스템 시간대를 쓰지 않는 이유: 운영 VPS 가 UTC 인 경우가 많고,
# 그러면 "저녁 8시" 가 실제로는 새벽 5시가 됩니다.
war:
  enabled: true

  # 개전 요일. 비우면 매일입니다. 한국어(월~일)와 영어(mon~sun) 모두 됩니다.
  days: []

  # HH:mm. end 가 start 보다 이르면 자정을 넘는 시간대로 해석합니다.
  start: "20:00"
  end: "22:00"

  # 개전 몇 분 전에 예고할지
  warn-minutes:
    - 60
    - 30
    - 10
    - 5
    - 1

# ── 코어 거점 ─────────────────────────────────────────────────────────
# 코어는 여기 적힌 지점에만 설치할 수 있습니다. 아무 데나 박을 수 없게 하는 것이
# D2 의 요구사항이고, 그래야 전투가 몇 곳으로 모여 서로 만나게 됩니다.
#
# y 는 적지 않습니다 — 설치 시 지표면을 씁니다. 고정하면 지형에 따라 허공이나
# 지하에 박힙니다 (드래곤 알 제단에서 한 번 겪은 실수입니다).
core-sites:
  - name: 북서
    world: world
    x: -400
    z: 400
  - name: 북동
    world: world
    x: 400
    z: 400
  - name: 남서
    world: world
    x: -400
    z: -400
  - name: 남동
    world: world
    x: 400
    z: -400
  - name: 중앙남
    world: world
    x: 0
    z: 600

territory:
  # 코어를 중심으로 몇 청크까지 영토인지. 8 이면 17×17 청크(272×272 블록)입니다.
  # 거점 간 거리가 800 블록이라 이 값으로는 영토가 겹치지 않습니다.
  claim-chunk-radius: 8

  # 거점으로 인정하는 반경(블록). 대좌 위 아무 칸에나 놓을 수 있게 넉넉히 둡니다.
  site-radius: 6

  # 스폰 주변 중립 구역 반경(블록). 여기서는 아무도 건축할 수 없습니다.
  neutral-radius: 100
  neutral-world: world

  # 한 길드가 동시에 가질 수 있는 코어 수. 한 길드가 전 거점을 독점하면
  # 다른 길드가 들어갈 자리가 없어 서버가 끝납니다.
  max-cores-per-guild: 2

  # 거점에 흑요석 대좌를 세울지. 플레이어가 거점을 찾을 수 있게 하는 표식입니다.
  build-pedestals: true

  # 시즌 점수 (§3.5 랭킹 보상의 재료)
  points:
    # 전쟁 시간대 종료까지 코어를 지켜냈을 때
    defended: 500
    # 남의 코어를 부쉈을 때
    core-destroyed: 200

# ── 코어 아이템 (D2) ──────────────────────────────────────────────────
core:
  # 국가 인장 가격. 제작 불가이므로 이 값이 코어 하나의 비용 하한이 됩니다.
  # 길드 금고에서 차감되고, 길드장만 살 수 있습니다.
  seal-price: 250000

  # 코어를 버리지 못하게 합니다. 일주일 모은 물건이라 실수 한 번이 치명적입니다.
  prevent-drop: true

  # 인장 상인 NPC
  merchant:
    enabled: true
    world: world
    x: 8.5
    z: 8.5
    # 음수면 지표면으로 스냅합니다.
    y: -1

# ── 국가창고 (§3.3) ───────────────────────────────────────────────────
storage:
  # 줄 수 (1~6). 줄이면 기존 내용이 칸 밖으로 밀려나므로 줄이지 마세요.
  rows: 6
  # 열려 있는 창고를 주기적으로 저장합니다 (분). 0 이면 끔.
  autosave-minutes: 5

# ── /tp [코어명] ──────────────────────────────────────────────────────
warp:
  # 평시 시전 시간(초)
  warmup-seconds: 5
  # 전쟁 중 시전 시간. 더 길게 둡니다 — 즉시 집결은 수비가 대응할 시간을
  # 아예 없애 버립니다.
  warmup-seconds-war: 10
  cooldown-seconds: 60
