# 러크 서버 — 홈 서버
# 프록시 뒤에 있으므로 이 포트는 외부에 노출하지 마세요.

server-port=25566
server-ip=127.0.0.1

# ⚠️ 프록시(Velocity)가 이미 정품 인증을 끝냈기 때문에 백엔드는 false가 정상입니다.
# 대신 이 포트가 외부에 열려 있으면 누구나 아무 UUID로 접속할 수 있습니다.
# 반드시 방화벽으로 막고, 프록시 포트(25565)만 여세요.
online-mode=false

motd=Ruc Server - 홈
max-players=100
view-distance=8
simulation-distance=6
enable-command-block=false
spawn-protection=0
allow-flight=true
enable-rcon=false
white-list=false
difficulty=peaceful
gamemode=adventure
