# RucCore 설정
# 4개 서버가 이 설정을 공유합니다. server-id만 서버별로 다르게 두세요.

# 이 서버가 네트워크에서 어떤 역할인지. home / raid / war / peace
server-id: raid

# 화면에 표시할 서버 이름 (스코어보드 등)
server-display-name: "약탈"

database:
  # h2  = 로컬 개발용 임베디드 DB (설치 불필요)
  # mysql = 운영용. VPS로 옮길 때 이것으로 변경
  type: h2

  # type: h2 일 때만 사용. 플러그인 폴더 기준 상대 경로.
  #
  # 4개 서버가 같은 파일을 봅니다 (AUTO_SERVER=TRUE 라 여러 프로세스가 열 수 있습니다).
  # 서버마다 DB 를 따로 두면 §3.1 "Ruc 는 모든 서버 공용"이 깨지고, 홈에서 인증한
  # 사람이 약탈로 건너가면 그쪽에서는 미인증자가 됩니다.
  h2-file: "../../../shared/ruc"

  # type: mysql 일 때만 사용
  mysql:
    host: localhost
    port: 3306
    database: ruc
    user: ruc
    password: ""
    # 4개 서버가 같은 DB를 쓰므로 서버당 풀은 작게
    pool-size: 6

language:
  # 언어를 한 번도 고르지 않은 플레이어에게 적용할 기본값 (§6.3 한국어 기본)
  default: ko

xp:
  # 레벨 n → n+1 에 필요한 경험치 = base * n^exponent
  # exponent를 올릴수록 고레벨 구간이 가팔라집니다 (§3.4)
  base: 100
  exponent: 2.2
  max-level: 100

  # 획득량 (§3.4)
  reward:
    player-kill: 120
    boss-kill: 400      # 위더, 엔더드래곤, 엘더 가디언, 워든
    elite-kill: 60      # 레이드 몬스터, 피글린 브루트 등
    advancement: 80
    normal-mob: 2       # "아주 적은 양"

economy:
  # 신규 플레이어 시작 자금
  starting-balance: 1000
  # 화면 표시 단위
  symbol: "Ruc"

scoreboard:
  enabled: true
  # 갱신 주기 (틱). 20틱 = 1초
  update-interval: 20
  title: "&a&lRUC SERVER"

# §2.2 전역 규칙 — 경험치바 근처에 좌표가 표시되지 않도록 합니다.
# reducedDebugInfo 게임룰을 켜서 F3 좌표를 가리고,
# RucCore는 액션바(경험치바 바로 위)에 좌표를 절대 출력하지 않습니다.
hide-coordinates: true

tpa:
  # 요청 만료 시간 (초)
  request-timeout: 60
  # 텔레포트 전 대기 시간 (초). 전투 중 도주 방지
  warmup-seconds: 3
  # 기본 쿨타임 (초). 후원 등급별 단축은 D7에서 적용
  cooldown-seconds: 60

# ── 디스코드 인증 (D10) ────────────────────────────────────────────────
# 미인증 플레이어는 홈 서버 인증 구역에 격리되어 이동·채팅·상호작용이 막힙니다.
# 접속 자체는 허용해서 서버 분위기는 보여주되, 피해를 줄 수단은 전부 차단합니다.
verification:
  enabled: true

  # 인증 구역 위치. 홈 광장 맵을 적용한 뒤 실제 좌표로 바꾸세요.
  area:
    world: hub
    x: 0.5
    y: 64.0
    z: 512.5
    yaw: 0.0
    pitch: 0.0
    # 이 반경을 벗어나면 즉시 되돌립니다
    radius: 11.0

  code:
    length: 6
    expire-seconds: 600        # 10분
    resend-cooldown-seconds: 60

  # 인증 완료를 감지하는 주기 (틱). 미인증자에 대해서만 돕니다.
  poll-interval-ticks: 60

  # 미인증 상태에서도 허용할 명령어
  allowed-commands:
    - "인증"
    - "verify"
    - "help"
    - "언어"
    - "ruclang"

# ── 길드 · 국가 (§3.5, §2.6) ──────────────────────────────────────────
# 길드는 4개 서버 공용입니다. 이 설정은 네 서버에서 같아야 합니다 —
# 특히 nation-threshold 가 어긋나면 어떤 서버에서는 국가인 길드가 다른 서버에서는
# 아니게 되어 국가전 입장 판정이 서버마다 달라집니다.
guild:
  # §2.6 — 길드원 수가 이 값 이상이면 "국가"로 인정되고, 국가전 서버에
  # 입장할 수 있습니다. 접속 인원이 아니라 소속 인원으로 셉니다.
  nation-threshold: 10

  # 한 길드의 최대 인원
  max-members: 30

  create:
    # §3.5 — 창설 조건: 최소 레벨 + Ruc 비용
    min-level: 10
    cost: 100000

  # 초대장 유효 시간 (초). DB에 저장되므로 다른 서버에서도 수락할 수 있습니다.
  invite-expire-seconds: 300

  # 다른 서버에서 일어난 가입·탈퇴를 따라잡는 주기 (초).
  # 짧게 두면 DB 조회가 늘고, 길게 두면 길드 목록이 늦게 갱신됩니다.
  refresh-seconds: 15

  # §3.5 — 주간 보상. 매주 월요일 00:00(timezone 기준)에 초기화되고,
  # 접속할 때 아직 안 받았으면 지급됩니다.
  weekly:
    base: 2000
    per-member: 300
    # 인원수 보상을 셀 때의 상한. 대형 길드로 몰리는 것을 완화합니다.
    count-cap: 20
    # 국가로 인정된 길드의 가산
    nation-multiplier: 1.5
    max: 20000

  # §3.5 — 시즌 정산. /길드관리 시즌마감 확인 으로 수동 실행합니다.
  season:
    rewards:
      - 1000000
      - 500000
      - 250000
      - 100000
      - 50000
    participation: 10000
    reset-points: true


# 주간 보상 초기화와 전쟁 시간대 판정의 기준 시간대입니다.
timezone: "Asia/Seoul"

# ── 우편함 (Phase 5.5) ────────────────────────────────────────────────
# 보상·거래 물품이 "지금 받을 수 없을 때" 도착하는 곳입니다. 4개 서버에서
# 값이 같아야 합니다 — keep-hours 가 서버마다 다르면 같은 우편의 남은 기간이
# 서버마다 다르게 보입니다.
mailbox:
  # 보관 기간 (시간). 720시간 = 30일.
  keep-hours: 720
  # 한 사람의 미수령 우편 상한. 목록은 한 장에 28통입니다.
  max-items: 100
  # 만료분·수령 영수증 청소 주기 (분).
  purge-interval-minutes: 60


# ── 칭호 · 채팅 (Phase 6) ──────────────────────────────────────────────
# 요구사항: 디스코드 서버에서 가진 "최상위 역할" 을 마크 닉네임 앞에 표시.
#
# 역할 → 칭호 판정은 이 설정이 합니다. 봇은 그 사람이 가진 역할 ID 를 그대로
# 넘기고, 무엇이 더 높은지는 priority 가 정합니다. 판정을 봇에 두면 우선순위가
# 두 군데에 적히고, 한쪽만 고쳐졌을 때 "디스코드에서는 관리자인데 게임에서는
# 일반" 이 됩니다.
#
# ⚠️ discord-role 에는 역할 **ID** 를 넣습니다 (이름이 아닙니다).
#    역할 이름은 바뀌지만 ID 는 바뀌지 않고, 이름에는 공백·쉼표가 들어가
#    RCON 인자로 실어 보낼 수 없습니다.
#    ID 는 MOOKI 를 켜면 콘솔에 전부 찍힙니다 ("[역할] <이름> = <ID>").
#
# display 는 MiniMessage 문법입니다 — 메시지 파일의 레거시 색코드(&a)와 다릅니다.
# 그라디언트가 필요해서입니다 (요구사항: 관리자·유료 칭호는 공들여 디자인).
titles:
  enabled: true

  # 다른 서버에서 일어난 칭호 변경을 따라잡는 주기 (초).
  # 봇의 RCON 은 한 서버로만 들어오므로, 이 갱신이 없으면 나머지 세 서버는
  # 칭호가 바뀐 것을 영원히 모릅니다.
  refresh-seconds: 30

  definitions:
    # ── 스태프 (§3.2) ───────────────────────────────────────────────
    owner:
      display: "<gradient:#ffd166:#ff6b6b><bold>[ 수장 ]</bold></gradient>"
      priority: 1000
      discord-role: "1414495321349951508"
    admin:
      display: "<gradient:#ff6b6b:#c77dff><bold>[ 관리자 ]</bold></gradient>"
      priority: 950
      discord-role: ""
    manager:
      display: "<gradient:#c77dff:#7aa2ff><bold>[ 매니저 ]</bold></gradient>"
      priority: 900
      discord-role: "1406889344890966077"
    moderator:
      display: "<color:#7aa2ff><bold>[ 중재자 ]</bold></color>"
      priority: 850
      discord-role: ""
    helper:
      display: "<color:#5bc0be><bold>[ 헬퍼 ]</bold></color>"
      priority: 800
      discord-role: ""
    builder:
      display: "<color:#b08968>[ 건축가 ]</color>"
      priority: 700
      discord-role: ""
    designer:
      display: "<color:#f4a3c1>[ 디자이너 ]</color>"
      priority: 690
      discord-role: "1425822763867705415"
    tester:
      display: "<color:#9aa0a6>[ 테스터 ]</color>"
      priority: 680
      discord-role: "1425823098602786827"

    # ── 후원 등급 (D7) — Phase 8 에서 결제와 연결됩니다 ──────────────
    # 지금은 정의만 둡니다. 역할 ID 를 채우면 즉시 동작합니다.
    elite:
      display: "<gradient:#f9f871:#ffffff:#f9f871><bold>[ ELITE ]</bold></gradient>"
      priority: 600
      discord-role: "1554021629959348285"
    premium:
      display: "<gradient:#a0e7e5:#b4f8c8><bold>[ PREMIUM ]</bold></gradient>"
      priority: 580
      discord-role: "1554021416427331584"
    prime:
      display: "<gradient:#ffb5a7:#fcd5ce><bold>[ PRIME ]</bold></gradient>"
      priority: 560
      discord-role: "1554021221736124464"
    mvp:
      display: "<color:#ffd166><bold>[ MVP ]</bold></color>"
      priority: 540
      discord-role: "1554021025048567868"
    svip:
      display: "<color:#a0c4ff>[ SVIP ]</color>"
      priority: 520
      discord-role: "1554020800246583356"
    vip:
      display: "<color:#9bf6ff>[ VIP ]</color>"
      priority: 500
      discord-role: "1554020486269239296"

    # ── 디스코드 부스트 (§5.2) ──────────────────────────────────────
    hyper:
      display: "<gradient:#ff7eb6:#c77dff><bold>[ HYPER ]</bold></gradient>"
      priority: 480
      discord-role: ""
    rocket:
      display: "<color:#ff7eb6>[ ROCKET ]</color>"
      priority: 460
      discord-role: "1554015273416130620"
    booster:
      display: "<color:#f5a3ff>[ BOOSTER ]</color>"
      priority: 440
      discord-role: "1414389895111118970"

    # ── 가이드 완주 (Phase 11) ──────────────────────────────────────
    # 디스코드 역할이 아니라 가이드를 끝내면 받습니다. discord-role 을 비워
    # 두면 동기화가 이 칭호를 회수하지 않습니다 (source 가 guide 라서도 안전).
    guide:
      display: "<color:#93e93e>[ 가이드 ]</color>"
      priority: 100
      discord-role: ""

# 채팅 한 줄의 모양. 요구사항: [머리] [칭호] [닉네임]: [내용]
chat:
  enabled: true

  # MiniMessage 문법. %head% %title% %name% 이 치환됩니다.
  # 본문(%message%)은 여기 넣지 않습니다 — 플레이어가 쓴 글을 MiniMessage 로
  # 해석하면 <click:run_command:...> 를 채팅에 심을 수 있습니다. 본문은
  # 접두부 뒤에 Component 로 그대로 붙습니다.
  format: "%head%%title%<white>%name%</white><dark_gray>:</dark_gray> "

  # 본문 색. 이름색(NamedTextColor) 또는 #RRGGBB.
  message-color: "white"

  # ⚠️ 스킨 머리는 바닐라 채팅에 넣을 수 없습니다.
  #
  # 채팅에 그릴 수 있는 그림은 리소스팩 폰트의 글리프뿐이고, 글리프는 리소스팩
  # 안에 미리 들어 있는 정적 이미지입니다. 접속하는 사람마다 다른 스킨을
  # 런타임에 글리프로 만들 방법이 없습니다.
  #
  # 디스코드 중계는 웹훅 아바타로 진짜 머리가 나옵니다. 인게임은 리소스팩(9b)이
  # 나오면 그 글리프 문자를 여기에 넣으세요. 그때까지 비워 둡니다 — 글리프가
  # 없는 코드포인트를 내보내면 모든 채팅 줄에 두부 문자(□)가 붙습니다.
  head-glyph: ""


# ── 디스코드 중계 (Phase 6-3, §4.1) ───────────────────────────────────
# 인게임 → 디스코드는 **플러그인이 웹훅으로 직접** 보냅니다. 봇을 거치지 않는
# 이유: 봇은 인게임 발언을 알 방법이 로그 파싱뿐이고, 채팅 줄에는 이미 칭호가
# 붙어 있어 어디까지가 칭호인지 모호합니다. 여기서 보내면 UUID·닉네임·칭호·본문을
# 정확한 값으로 들고 있는 자리에서 그대로 나갑니다.
#
# 디스코드 → 인게임은 봇이 RCON(/rucrelay)으로 넣습니다. 그쪽 메시지는 봇만
# 볼 수 있기 때문입니다.
relay:
  # 웹훅 URL 을 넣고 이것을 true 로 바꾸면 켜집니다.
  enabled: false

  # ⚠️ 서버마다 다른 URL 을 넣으세요. **웹훅 URL 이 곧 채널**이라서,
  #    이 한 줄이 §4.1 의 "서버별 채널 매핑" 입니다.
  #    디스코드: 채널 설정 → 연동 → 웹훅 → 새 웹훅 → URL 복사
  #
  # ⚠️ 이 URL 은 비밀입니다. 아는 사람은 누구나 그 채널에 글을 쓸 수 있습니다.
  #    git 에 올리지 마세요 (배포본 config 는 .gitignore 확인).
  webhook-url: ""

  # 시스템 알림(입퇴장·발전과제·사망)을 다른 채널로 보내고 싶을 때.
  # 비워 두면 발언과 같은 채널로 가고, 모양만 임베드로 구분됩니다.
  system-webhook-url: ""

  # 무엇을 중계할지
  chat: true
  join: true
  quit: true
  advancement: true
  death: true

  # 디스코드 → 인게임 (봇의 /rucrelay 를 받을지)
  discord-to-game: true

  # 디스코드에서 온 발언의 인게임 표시. %author% 가 치환됩니다.
  # 본문은 여기 넣지 않습니다 — Component 로 그대로 붙습니다 (태그 방지).
  in-game-format: "&9[디스코드] &f%author%&7: &f"

  # 발언자의 머리 이미지. %uuid% 가 치환됩니다.
  # 프록시를 거치면 UUID 가 바뀐다는 함정이 있습니다 — 여기 들어가는 값은
  # ruc_player 에 저장된 UUID 이므로 정답입니다.
  avatar-url: "https://mc-heads.net/avatar/%uuid%/64"

  # 보내는 간격 (틱). 20틱 = 1초.
  # 디스코드 웹훅은 초당 몇 건으로 제한됩니다. 10틱(0.5초)이면 초당 2건이라
  # 안전합니다. 줄이면 429(속도 제한)를 받기 시작합니다.
  min-interval-ticks: 10

  # 대기 큐 크기. 넘치면 오래된 것부터 버리고 종료 시 로그에 몇 건 버렸는지
  # 남깁니다. 채팅 중계가 밀렸다고 서버가 느려지는 것이 훨씬 나쁩니다.
  queue-max: 200
