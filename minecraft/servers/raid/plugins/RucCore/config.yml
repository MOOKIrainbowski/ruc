# RucCore 설정
# 4개 서버가 이 설정을 공유합니다. server-id만 서버별로 다르게 두세요.

# 이 서버가 네트워크에서 어떤 역할인지. home / raid / war / peace
server-id: raid

# 화면에 표시할 서버 이름 (스코어보드 등)
server-display-name: "약탈"

database:
  # h2  = 로컬 개발용 임베디드 DB (설치 불필요)
  # mysql = 운영용. VPS로 옮길 때 이것으로 변경
  type: h2

  # type: h2 일 때만 사용. 플러그인 폴더 기준 상대 경로.
  #
  # 4개 서버가 같은 파일을 봅니다 (AUTO_SERVER=TRUE 라 여러 프로세스가 열 수 있습니다).
  # 서버마다 DB 를 따로 두면 §3.1 "Ruc 는 모든 서버 공용"이 깨지고, 홈에서 인증한
  # 사람이 약탈로 건너가면 그쪽에서는 미인증자가 됩니다.
  h2-file: "../../../shared/ruc"

  # type: mysql 일 때만 사용
  mysql:
    host: localhost
    port: 3306
    database: ruc
    user: ruc
    password: ""
    # 4개 서버가 같은 DB를 쓰므로 서버당 풀은 작게
    pool-size: 6

language:
  # 언어를 한 번도 고르지 않은 플레이어에게 적용할 기본값 (§6.3 한국어 기본)
  default: ko

xp:
  # 레벨 n → n+1 에 필요한 경험치 = base * n^exponent
  # exponent를 올릴수록 고레벨 구간이 가팔라집니다 (§3.4)
  base: 100
  exponent: 2.2
  max-level: 100

  # 획득량 (§3.4)
  reward:
    player-kill: 120
    boss-kill: 400      # 위더, 엔더드래곤, 엘더 가디언, 워든
    elite-kill: 60      # 레이드 몬스터, 피글린 브루트 등
    advancement: 80
    normal-mob: 2       # "아주 적은 양"

economy:
  # 신규 플레이어 시작 자금
  starting-balance: 1000
  # 화면 표시 단위
  symbol: "Ruc"

scoreboard:
  enabled: true
  # 갱신 주기 (틱). 20틱 = 1초
  update-interval: 20
  title: "&a&lRUC SERVER"

# §2.2 전역 규칙 — 경험치바 근처에 좌표가 표시되지 않도록 합니다.
# reducedDebugInfo 게임룰을 켜서 F3 좌표를 가리고,
# RucCore는 액션바(경험치바 바로 위)에 좌표를 절대 출력하지 않습니다.
hide-coordinates: true

tpa:
  # 요청 만료 시간 (초)
  request-timeout: 60
  # 텔레포트 전 대기 시간 (초). 전투 중 도주 방지
  warmup-seconds: 3
  # 기본 쿨타임 (초). 후원 등급별 단축은 D7에서 적용
  cooldown-seconds: 60

# ── 디스코드 인증 (D10) ────────────────────────────────────────────────
# 미인증 플레이어는 홈 서버 인증 구역에 격리되어 이동·채팅·상호작용이 막힙니다.
# 접속 자체는 허용해서 서버 분위기는 보여주되, 피해를 줄 수단은 전부 차단합니다.
verification:
  enabled: true

  # 인증 구역 위치. 홈 광장 맵을 적용한 뒤 실제 좌표로 바꾸세요.
  area:
    world: hub
    x: 0.5
    y: 64.0
    z: 512.5
    yaw: 0.0
    pitch: 0.0
    # 이 반경을 벗어나면 즉시 되돌립니다
    radius: 11.0

  code:
    length: 6
    expire-seconds: 600        # 10분
    resend-cooldown-seconds: 60

  # 인증 완료를 감지하는 주기 (틱). 미인증자에 대해서만 돕니다.
  poll-interval-ticks: 60

  # 미인증 상태에서도 허용할 명령어
  allowed-commands:
    - "인증"
    - "verify"
    - "help"
    - "언어"
    - "ruclang"

# ── 길드 · 국가 (§3.5, §2.6) ──────────────────────────────────────────
# 길드는 4개 서버 공용입니다. 이 설정은 네 서버에서 같아야 합니다 —
# 특히 nation-threshold 가 어긋나면 어떤 서버에서는 국가인 길드가 다른 서버에서는
# 아니게 되어 국가전 입장 판정이 서버마다 달라집니다.
guild:
  # §2.6 — 길드원 수가 이 값 이상이면 "국가"로 인정되고, 국가전 서버에
  # 입장할 수 있습니다. 접속 인원이 아니라 소속 인원으로 셉니다.
  nation-threshold: 10

  # 한 길드의 최대 인원
  max-members: 30

  create:
    # §3.5 — 창설 조건: 최소 레벨 + Ruc 비용
    min-level: 10
    cost: 100000

  # 초대장 유효 시간 (초). DB에 저장되므로 다른 서버에서도 수락할 수 있습니다.
  invite-expire-seconds: 300

  # 다른 서버에서 일어난 가입·탈퇴를 따라잡는 주기 (초).
  # 짧게 두면 DB 조회가 늘고, 길게 두면 길드 목록이 늦게 갱신됩니다.
  refresh-seconds: 15

  # §3.5 — 주간 보상. 매주 월요일 00:00(timezone 기준)에 초기화되고,
  # 접속할 때 아직 안 받았으면 지급됩니다.
  weekly:
    base: 2000
    per-member: 300
    # 인원수 보상을 셀 때의 상한. 대형 길드로 몰리는 것을 완화합니다.
    count-cap: 20
    # 국가로 인정된 길드의 가산
    nation-multiplier: 1.5
    max: 20000

  # §3.5 — 시즌 정산. /길드관리 시즌마감 확인 으로 수동 실행합니다.
  season:
    rewards:
      - 1000000
      - 500000
      - 250000
      - 100000
      - 50000
    participation: 10000
    reset-points: true


# 주간 보상 초기화와 전쟁 시간대 판정의 기준 시간대입니다.
timezone: "Asia/Seoul"

# ── 우편함 (Phase 5.5) ────────────────────────────────────────────────
# 보상·거래 물품이 "지금 받을 수 없을 때" 도착하는 곳입니다. 4개 서버에서
# 값이 같아야 합니다 — keep-hours 가 서버마다 다르면 같은 우편의 남은 기간이
# 서버마다 다르게 보입니다.
mailbox:
  # 보관 기간 (시간). 720시간 = 30일.
  keep-hours: 720
  # 한 사람의 미수령 우편 상한. 목록은 한 장에 28통입니다.
  max-items: 100
  # 만료분·수령 영수증 청소 주기 (분).
  purge-interval-minutes: 60
